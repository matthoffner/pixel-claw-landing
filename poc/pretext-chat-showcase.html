<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Claw — Pretext Chat Showcase</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0a0e17; color: #eaf0ff; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .muted { color: #9ca8c9; }
    .controls, .card { background: #11192a; border: 1px solid #243457; border-radius: 12px; padding: 14px; }
    .controls { margin-top: 14px; display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 10px; align-items: end; }
    label { font-size: 13px; color: #b9c6ea; display: block; margin-bottom: 6px; }
    textarea, input, select, button { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #344876; background: #0c1324; color: #edf2ff; padding: 10px; }
    textarea { min-height: 80px; resize: vertical; }
    button { width: auto; cursor: pointer; font-weight: 600; background: #2457ff; border-color: #2457ff; }
    .stats { margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
    .pill { background:#0c1324; border:1px solid #2b3f6a; border-radius:10px; padding:10px; }
    .pill b { display:block; font-size:18px; }
    .grid { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .title { font-weight: 700; margin-bottom: 8px; }
    .chat { height: 460px; overflow: auto; background: #0b1120; border: 1px solid #273861; border-radius: 10px; padding: 10px; }
    .msg { max-width: 82%; margin: 8px 0; padding: 10px 12px; border-radius: 14px; line-height: 1.45; white-space: normal; overflow-wrap: break-word; }
    .assistant { background: #1a2742; border: 1px solid #31497b; }
    .user { background: #1b3c2f; border: 1px solid #2f6b56; margin-left: auto; }
    code { color: #8cd0ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pretext Chat Showcase</h1>
    <div class="muted">Separate demo for Pixel Claw: compare normal DOM chat rendering vs Pretext pre-sized bubbles during streaming updates.</div>

    <div class="controls">
      <div>
        <label for="text">Assistant message to stream</label>
        <textarea id="text">Great — I generated 3 launch variants for your onboarding card. Variant B usually converts best because it leads with proof first, then asks for setup. Also validated multilingual overflow for مرحبا and emoji 🚀 without clipping.</textarea>
      </div>
      <div>
        <label for="font">Font</label>
        <input id="font" value="16px Inter" />
      </div>
      <div>
        <label for="lineHeight">Line Height (px)</label>
        <input id="lineHeight" type="number" min="18" max="42" value="24" />
      </div>
      <div>
        <button id="run">Run showcase</button>
      </div>
    </div>

    <div class="stats">
      <div class="pill"><b id="domJank">-</b><span class="muted">DOM cumulative shift px</span></div>
      <div class="pill"><b id="pretextJank">-</b><span class="muted">Pretext cumulative shift px</span></div>
      <div class="pill"><b id="domMs">-</b><span class="muted">DOM total render ms</span></div>
      <div class="pill"><b id="pretextMs">-</b><span class="muted">Pretext total render ms</span></div>
    </div>

    <div class="grid">
      <section class="card">
        <div class="title">A) DOM chat (baseline)</div>
        <div id="chatDom" class="chat"></div>
      </section>
      <section class="card">
        <div class="title">B) Pretext pre-sized chat</div>
        <div id="chatPretext" class="chat"></div>
      </section>
    </div>
  </div>

  <script type="module">
    const textEl = document.getElementById('text');
    const fontEl = document.getElementById('font');
    const lineHeightEl = document.getElementById('lineHeight');
    const runBtn = document.getElementById('run');

    const domJankEl = document.getElementById('domJank');
    const pretextJankEl = document.getElementById('pretextJank');
    const domMsEl = document.getElementById('domMs');
    const pretextMsEl = document.getElementById('pretextMs');

    const chatDom = document.getElementById('chatDom');
    const chatPretext = document.getElementById('chatPretext');

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const now = () => performance.now();

    function baseChat(container) {
      container.innerHTML = '';
      const intro = document.createElement('div');
      intro.className = 'msg user';
      intro.textContent = 'Can you improve the launch copy and keep it readable in chat cards?';
      container.appendChild(intro);
    }

    function appendAssistant(container, text) {
      const m = document.createElement('div');
      m.className = 'msg assistant';
      m.textContent = text;
      container.appendChild(m);
      return m;
    }

    async function run() {
      runBtn.disabled = true;
      runBtn.textContent = 'Running...';

      const api = await import('https://esm.sh/@chenglou/pretext@0.0.4');
      const fullText = textEl.value;
      const font = fontEl.value.trim() || '16px Inter';
      const lineHeight = Number(lineHeightEl.value) || 24;

      baseChat(chatDom);
      baseChat(chatPretext);

      const domMsg = appendAssistant(chatDom, '');
      const preMsg = appendAssistant(chatPretext, '');
      preMsg.style.font = font;
      preMsg.style.lineHeight = `${lineHeight}px`;

      let domJank = 0;
      let preJank = 0;
      let domPrev = domMsg.getBoundingClientRect().height;
      let prePrev = preMsg.getBoundingClientRect().height;

      const domStart = now();
      for (let i = 1; i <= fullText.length; i += 6) {
        domMsg.textContent = fullText.slice(0, i);
        const h = domMsg.getBoundingClientRect().height;
        domJank += Math.abs(h - domPrev);
        domPrev = h;
        chatDom.scrollTop = chatDom.scrollHeight;
        await sleep(6);
      }
      const domTotal = now() - domStart;

      const preStart = now();
      const bubbleWidth = Math.floor(chatPretext.clientWidth * 0.82) - 26;
      const preparedFull = api.prepare(fullText, font);
      const measuredFull = api.layout(preparedFull, bubbleWidth, lineHeight);
      // Reserve final bubble size up front (the real Pretext UX win: no growth-jank while streaming)
      preMsg.style.height = `${Math.max(lineHeight, measuredFull.height + 4)}px`;
      prePrev = preMsg.getBoundingClientRect().height;

      for (let i = 1; i <= fullText.length; i += 6) {
        const partial = fullText.slice(0, i);
        preMsg.textContent = partial;

        const h = preMsg.getBoundingClientRect().height;
        preJank += Math.abs(h - prePrev);
        prePrev = h;
        chatPretext.scrollTop = chatPretext.scrollHeight;
        await sleep(6);
      }
      const preTotal = now() - preStart;

      domJankEl.textContent = domJank.toFixed(1);
      pretextJankEl.textContent = preJank.toFixed(1);
      domMsEl.textContent = domTotal.toFixed(1);
      pretextMsEl.textContent = preTotal.toFixed(1);

      runBtn.disabled = false;
      runBtn.textContent = 'Run showcase';
    }

    runBtn.addEventListener('click', run);
    run();
  </script>
</body>
</html>
