<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Claw — Pretext Functional Chat Showcase</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0a0f19; color: #ebf1ff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .muted { color: #9eabcf; }
    .card { background: #10192d; border: 1px solid #273a62; border-radius: 12px; padding: 12px; margin-top: 12px; }
    .top { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; }
    label { display:block; font-size: 12px; color: #b7c5eb; margin-bottom: 6px; }
    select, input, button, textarea { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #334b7a; background:#0b1324; color:#eef3ff; padding:10px; }
    button { cursor:pointer; font-weight:600; background:#2557ff; border-color:#2557ff; }
    .kpis { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px; }
    .pill { background:#0b1324; border:1px solid #2f436f; border-radius:10px; padding:10px; }
    .pill b { display:block; font-size:18px; }
    .chat { height: 500px; overflow:auto; background:#0b1221; border:1px solid #2b406c; border-radius:10px; padding:10px; margin-top:10px; }
    .msg { box-sizing: border-box; max-width: 360px; padding: 10px 12px; border-radius: 14px; line-height: 1.45; margin: 8px 0; white-space: pre-wrap; overflow-wrap: break-word; }
    .user { margin-left:auto; background:#183a2f; border:1px solid #2f6a56; }
    .assistant { background:#1a2743; border:1px solid #324c80; }
    .composer { display:grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
    .status { font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pretext Functional Chat Showcase</h1>
    <div class="muted">Real chat interaction + streamed assistant response. Toggle baseline vs Pretext to see the stability difference.</div>

    <section class="card">
      <div class="top">
        <div>
          <label for="mode">Render mode</label>
          <select id="mode">
            <option value="dom">Baseline DOM (no pre-size)</option>
            <option value="pretext" selected>Pretext pre-size (recommended)</option>
          </select>
        </div>
        <div>
          <label for="font">Font</label>
          <input id="font" value="16px Inter" />
        </div>
        <div>
          <label for="lineHeight">Line Height (px)</label>
          <input id="lineHeight" type="number" min="18" max="40" value="24" />
        </div>
      </div>

      <div class="kpis">
        <div class="pill"><b id="kpiShift">0.0</b><span class="muted">Bubble growth shift (px)</span></div>
        <div class="pill"><b id="kpiFrames">0</b><span class="muted">Streaming frames</span></div>
        <div class="pill"><b id="kpiMs">0.0</b><span class="muted">Assistant stream time (ms)</span></div>
        <div class="pill"><b id="kpiMode">pretext</b><span class="muted">Current mode</span></div>
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer">
        <textarea id="input" rows="2">Give me 3 launch copy variants and explain which one should convert best.</textarea>
        <button id="send">Send</button>
      </div>
      <div id="status" class="status muted">Ready.</div>
    </section>
  </div>

  <script type="module">
    const chat = document.getElementById('chat');
    const modeEl = document.getElementById('mode');
    const fontEl = document.getElementById('font');
    const lineHeightEl = document.getElementById('lineHeight');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');

    const kpiShift = document.getElementById('kpiShift');
    const kpiFrames = document.getElementById('kpiFrames');
    const kpiMs = document.getElementById('kpiMs');
    const kpiMode = document.getElementById('kpiMode');

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const replies = [
      `Here are 3 variants:\n\nA) \"Launch in one click. Pixel Claw turns your rough app idea into production-ready UI flows in minutes.\"\n\nB) \"From idea to clickable demo in 30 minutes. Pixel Claw plans, designs, and ships your first flow fast.\"\n\nC) \"Stop starting from blank screens. Pixel Claw gives you launch-ready product flows with conversion-aware defaults.\"\n\nBest bet: B, because it leads with a concrete time-to-value promise and outcome.`,
      `Great prompt. I’d test these:\n\n1) Outcome-first\n2) Time-to-value\n3) Pain-relief\n\nFor early buyers, time-to-value usually wins if you can prove it with a visible POC and a clear before/after.`
    ];

    let pretext;
    try {
      pretext = await import('https://esm.sh/@chenglou/pretext@0.0.4');
    } catch (e) {
      statusEl.textContent = `Could not load Pretext: ${e?.message || e}`;
      statusEl.style.color = '#ff9fa0';
    }

    function addMsg(role, text='') {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function seed() {
      chat.innerHTML = '';
      addMsg('assistant', 'Welcome — switch between DOM and Pretext mode, then send prompts and watch the stream behavior.');
    }

    async function streamAssistant(fullText) {
      const mode = modeEl.value;
      const font = fontEl.value.trim() || '16px Inter';
      const lineHeight = Number(lineHeightEl.value) || 24;
      kpiMode.textContent = mode;

      const bubble = addMsg('assistant', '');
      bubble.style.font = font;
      bubble.style.lineHeight = `${lineHeight}px`;

      const bubbleWidth = 336; // max-width minus horizontal padding
      if (mode === 'pretext' && pretext) {
        const prepared = pretext.prepare(fullText, font, { whiteSpace: 'pre-wrap' });
        const measured = pretext.layout(prepared, bubbleWidth, lineHeight);
        const verticalChrome = 22; // 10px top + 10px bottom + 1px*2 border
        bubble.style.height = `${Math.max(lineHeight + verticalChrome, measured.height + verticalChrome)}px`;
      } else {
        bubble.style.height = '';
      }

      let totalShift = 0;
      let prevHeight = bubble.getBoundingClientRect().height;
      let frames = 0;
      const start = performance.now();

      for (let i = 1; i <= fullText.length; i += 5) {
        bubble.textContent = fullText.slice(0, i);
        const h = bubble.getBoundingClientRect().height;
        totalShift += Math.abs(h - prevHeight);
        prevHeight = h;
        frames++;
        chat.scrollTop = chat.scrollHeight;
        await sleep(8);
      }

      kpiShift.textContent = totalShift.toFixed(1);
      kpiFrames.textContent = String(frames);
      kpiMs.textContent = (performance.now() - start).toFixed(1);
      statusEl.textContent = `Done. ${mode === 'pretext' ? 'Pre-sized bubble kept layout stable.' : 'Baseline bubble grew during stream.'}`;
      statusEl.style.color = '#9eabcf';
    }

    async function onSend() {
      const q = inputEl.value.trim();
      if (!q) return;
      sendBtn.disabled = true;
      addMsg('user', q);
      statusEl.textContent = 'Streaming assistant response...';

      const reply = replies[Math.floor(Math.random() * replies.length)];
      await streamAssistant(reply);

      sendBtn.disabled = false;
    }

    modeEl.addEventListener('change', () => {
      statusEl.textContent = modeEl.value === 'pretext'
        ? 'Pretext mode: assistant bubbles are pre-sized before stream.'
        : 'DOM mode: assistant bubble grows naturally during stream.';
    });

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') onSend();
    });

    seed();
  </script>
</body>
</html>
