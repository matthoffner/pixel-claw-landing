<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Claw — Prompt to Widget App</title>
    <style>
      :root {
        --bg: #060b17;
        --panel: #111a35;
        --line: #2a3c67;
        --text: #eef4ff;
        --muted: #aebce0;
        --cyan: #5be5ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(900px 460px at 85% -25%, #2b1650 0%, transparent 60%), var(--bg);
      }
      .layout { min-height: 100vh; display: grid; grid-template-columns: 360px 1fr; }
      .left { border-right: 1px solid var(--line); background: rgba(10,16,36,.92); padding: 16px; }
      .right { padding: 16px; }
      h1 { margin: 0 0 6px; font-size: 26px; }
      h2 { margin: 0 0 8px; font-size: 13px; color: #9fc8ff; text-transform: uppercase; letter-spacing: .08em; }
      p { margin: 0; color: var(--muted); line-height: 1.45; }
      .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); margin-top: 12px; }
      textarea, input, button { font: inherit; }
      textarea, input {
        width: 100%; border: 1px solid #334673; border-radius: 10px; background: #0b1430; color: var(--text);
        padding: 10px;
      }
      textarea { min-height: 92px; resize: vertical; }
      .btn {
        border: 1px solid #3a5b88; border-radius: 10px; background: linear-gradient(90deg,#5be5ff,#93f1ff);
        color: #04111a; font-weight: 700; padding: 10px 12px; cursor: pointer;
      }
      .btn.ghost { background: #0c1633; color: var(--text); border-color: #334773; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .status { margin-top: 10px; color: #9fd7ff; font-size: 13px; }
      .shell {
        border: 1px solid var(--line); border-radius: 16px; min-height: calc(100vh - 32px);
        background: rgba(12,20,42,.92); overflow: hidden;
      }
      .shell-top { border-bottom: 1px solid var(--line); padding: 14px; display:flex; justify-content:space-between; align-items:center; }
      .badge { border: 1px solid #2f5f8e; border-radius: 999px; padding: 4px 9px; font-size: 12px; color: #a8deff; }
      #appRoot { padding: 14px; }
      @media (max-width: 940px) {
        .layout { grid-template-columns: 1fr; }
        .left { border-right: 0; border-bottom: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <aside class="left">
        <h1>Prompt → App</h1>
        <p>Write what app you want. We generate a full-screen widget app, not a dev console.</p>

        <div class="card">
          <h2>Prompt</h2>
          <textarea id="prompt">Build me a todo app widget with three states: Planning, Active, Done. Keep it fast and simple.</textarea>
          <div class="row" style="margin-top:10px;">
            <button id="generate" class="btn">Generate app</button>
            <button id="seed" class="btn ghost">Seed sample tasks</button>
          </div>
          <div class="status" id="status">Ready.</div>
        </div>

        <div class="card">
          <h2>Session</h2>
          <input id="sessionNs" value="session:widget-demo:matt" />
          <p style="margin-top:8px;">State is saved to this namespace so the app feels persistent.</p>
        </div>
      </aside>

      <section class="right">
        <div class="shell">
          <div class="shell-top">
            <div>
              <div class="badge">LIVE WIDGET APP</div>
              <div style="margin-top:6px;font-weight:700;">Todo Flow Demo</div>
            </div>
            <button id="reset" class="btn ghost" style="padding:8px 10px;">Reset</button>
          </div>
          <div id="appRoot"></div>
        </div>
      </section>
    </main>

    <script type="module">
      import * as esbuild from 'https://esm.sh/esbuild-wasm@0.25.3';

      const statusEl = document.getElementById('status');
      const promptEl = document.getElementById('prompt');
      const sessionEl = document.getElementById('sessionNs');
      const appRoot = document.getElementById('appRoot');

      let runtimeReady = false;
      let appState = { todos: [] };

      const defaultTodos = [
        { id: 1, title: 'Draft weekly priorities', status: 'planning' },
        { id: 2, title: 'Ship homepage improvement', status: 'active' },
        { id: 3, title: 'Review completed tasks', status: 'done' }
      ];

      function nsKey() { return `pixel-claw:${sessionEl.value.trim() || 'session:default'}`; }
      function saveState() { localStorage.setItem(nsKey(), JSON.stringify(appState)); }
      function loadState() {
        const raw = localStorage.getItem(nsKey());
        if (!raw) return { todos: structuredClone(defaultTodos) };
        try { return JSON.parse(raw); } catch { return { todos: structuredClone(defaultTodos) }; }
      }

      function appSource(prompt) {
        const safePrompt = JSON.stringify(prompt);
        return `
          globalThis.__pixelWidgetFactory = ({ state, setState, prompt }) => {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'grid';
            wrapper.style.gap = '12px';

            const hero = document.createElement('div');
            hero.style.border = '1px solid #2a3c67';
            hero.style.borderRadius = '12px';
            hero.style.padding = '12px';
            hero.style.background = '#111a35';
            hero.innerHTML = \
              '<div style="font-size:12px;color:#9ec9ff;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Generated app</div>' +
              '<div style="font-size:22px;font-weight:700;color:#eef4ff;">Todo Widget</div>' +
              '<div style="margin-top:6px;color:#adbbe0;">' + prompt + '</div>';
            wrapper.appendChild(hero);

            const lanes = document.createElement('div');
            lanes.style.display = 'grid';
            lanes.style.gridTemplateColumns = 'repeat(auto-fit, minmax(220px, 1fr))';
            lanes.style.gap = '10px';

            const defs = [
              { key: 'planning', title: 'Planning', action: 'Start', next: 'active' },
              { key: 'active', title: 'Active', action: 'Complete', next: 'done' },
              { key: 'done', title: 'Done', action: '', next: '' }
            ];

            defs.forEach(def => {
              const lane = document.createElement('div');
              lane.style.border = '1px solid #2a3c67';
              lane.style.borderRadius = '12px';
              lane.style.padding = '10px';
              lane.style.background = '#0e1733';

              const title = document.createElement('div');
              const count = state.todos.filter(t => t.status === def.key).length;
              title.textContent = def.title + ' (' + count + ')';
              title.style.fontWeight = '700';
              title.style.marginBottom = '8px';
              lane.appendChild(title);

              const tasks = state.todos.filter(t => t.status === def.key);
              if (!tasks.length) {
                const empty = document.createElement('div');
                empty.style.color = '#8fa4d5';
                empty.style.fontSize = '13px';
                empty.textContent = 'No tasks here yet';
                lane.appendChild(empty);
              }

              tasks.forEach(task => {
                const row = document.createElement('div');
                row.style.border = '1px solid #334773';
                row.style.borderRadius = '10px';
                row.style.padding = '8px';
                row.style.marginBottom = '8px';
                row.style.background = '#0b1430';

                const text = document.createElement('div');
                text.textContent = task.title;
                text.style.marginBottom = '7px';
                row.appendChild(text);

                if (def.next) {
                  const btn = document.createElement('button');
                  btn.textContent = def.action;
                  btn.style.border = '1px solid #38618f';
                  btn.style.borderRadius = '9px';
                  btn.style.padding = '6px 8px';
                  btn.style.background = '#14284c';
                  btn.style.color = '#d9ecff';
                  btn.style.cursor = 'pointer';
                  btn.onclick = () => {
                    setState({
                      ...state,
                      todos: state.todos.map(t => t.id === task.id ? { ...t, status: def.next } : t)
                    });
                  };
                  row.appendChild(btn);
                }

                lane.appendChild(row);
              });

              lanes.appendChild(lane);
            });

            const addWrap = document.createElement('div');
            addWrap.style.border = '1px solid #2a3c67';
            addWrap.style.borderRadius = '12px';
            addWrap.style.padding = '12px';
            addWrap.style.background = '#111a35';
            addWrap.style.display = 'grid';
            addWrap.style.gap = '8px';

            const addTitle = document.createElement('div');
            addTitle.textContent = 'Add task';
            addTitle.style.fontWeight = '700';
            addWrap.appendChild(addTitle);

            const input = document.createElement('input');
            input.placeholder = 'What needs to get done?';
            input.style.width = '100%';
            input.style.border = '1px solid #334673';
            input.style.borderRadius = '9px';
            input.style.padding = '9px';
            input.style.background = '#0b1430';
            input.style.color = '#eef4ff';
            addWrap.appendChild(input);

            const add = document.createElement('button');
            add.textContent = 'Add to Planning';
            add.style.border = '1px solid #3a5b88';
            add.style.borderRadius = '9px';
            add.style.padding = '8px 10px';
            add.style.background = '#14284c';
            add.style.color = '#d9ecff';
            add.style.cursor = 'pointer';
            add.onclick = () => {
              const title = input.value.trim();
              if (!title) return;
              setState({ ...state, todos: [{ id: Date.now(), title, status: 'planning' }, ...state.todos] });
            };
            addWrap.appendChild(add);

            wrapper.appendChild(lanes);
            wrapper.appendChild(addWrap);
            return wrapper;
          };

          globalThis.__pixelWidgetFactoryPrompt = ${safePrompt};
        `;
      }

      async function ensureRuntime() {
        if (runtimeReady) return;
        statusEl.textContent = 'Initializing in-browser compiler…';
        await esbuild.initialize({ wasmURL: 'https://esm.sh/esbuild-wasm@0.25.3/esbuild.wasm' });
        runtimeReady = true;
      }

      async function compileAndRender() {
        try {
          await ensureRuntime();
          const prompt = promptEl.value.trim() || 'Todo app widget';
          const source = appSource(prompt);
          statusEl.textContent = 'Compiling app…';
          const result = await esbuild.transform(source, { loader: 'ts', target: 'es2020', format: 'iife' });
          // eslint-disable-next-line no-new-func
          new Function(result.code)();

          renderFromFactory(prompt);
          statusEl.textContent = 'Done. App compiled in browser with esbuild.';
        } catch (err) {
          console.error(err);
          statusEl.textContent = `Compile error: ${err.message || err}`;
        }
      }

      function renderFromFactory(prompt) {
        const factory = globalThis.__pixelWidgetFactory;
        if (!factory) return;

        const setState = (next) => {
          appState = next;
          saveState();
          renderFromFactory(prompt);
        };

        appRoot.innerHTML = '';
        const node = factory({ state: appState, setState, prompt });
        appRoot.appendChild(node);
      }

      function seedTasks() {
        appState = { todos: structuredClone(defaultTodos) };
        saveState();
        compileAndRender();
      }

      document.getElementById('generate').addEventListener('click', compileAndRender);
      document.getElementById('seed').addEventListener('click', seedTasks);
      document.getElementById('reset').addEventListener('click', () => {
        localStorage.removeItem(nsKey());
        appState = { todos: structuredClone(defaultTodos) };
        compileAndRender();
      });
      sessionEl.addEventListener('change', () => {
        appState = loadState();
        compileAndRender();
      });

      appState = loadState();
      compileAndRender();
    </script>
  </body>
</html>
