<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Agents Widget OS (POC)</title>
    <style>
      :root {
        --bg: #070c1a;
        --panel: #111a33;
        --panel-2: #0c1430;
        --line: #2a3965;
        --text: #eef4ff;
        --muted: #adbbe2;
        --cyan: #5be5ff;
        --green: #7bf5b7;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: Inter, system-ui, sans-serif; background: radial-gradient(900px 480px at 100% -20%, #2b1850 0%, transparent 58%), var(--bg); color: var(--text); }
      .app { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; }
      .left { border-right: 1px solid var(--line); background: rgba(11,18,38,.9); padding: 16px; }
      .right { padding: 16px; }
      h1 { margin: 0 0 6px; font-size: 24px; }
      h2 { margin: 0 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .07em; color: #9dc8ff; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      .stack { display: grid; gap: 10px; margin-top: 12px; }
      .card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px; }
      .agent-btn { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 10px; cursor: pointer; }
      .agent-btn.active { border-color: #5be5ff; background: rgba(36,72,99,.35); }
      .label { font-size: 12px; color: #9eb0dc; margin-bottom: 6px; }
      input, select { width: 100%; border: 1px solid #2f3f6c; border-radius: 9px; background: #0b132b; color: var(--text); padding: 9px; }
      .badge { display: inline-block; border: 1px solid #305f49; color: var(--green); background: rgba(26,71,50,.25); border-radius: 999px; padding: 5px 8px; font-size: 12px; }
      .workspace { border: 1px solid var(--line); border-radius: 14px; background: rgba(13,21,42,.9); min-height: calc(100vh - 32px); display: grid; grid-template-rows: auto auto 1fr; }
      .workspace-top { padding: 14px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
      .tabs { display:flex; gap:8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .tab { border:1px solid var(--line); background:#0c1530; color:var(--text); border-radius:999px; padding:8px 12px; font-size:13px; cursor:pointer; }
      .tab.active { border-color: var(--cyan); color: #04111a; background: linear-gradient(90deg, #5be5ff, #88efff); font-weight: 700; }
      .content { padding: 14px; display:grid; gap:12px; align-content:start; }
      .panel { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:12px; }
      .kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
      .kpi { border:1px solid var(--line); border-radius:10px; background:#0d1734; padding:10px; }
      .kpi .num { font-size:22px; font-weight:700; }
      .timeline { display:grid; gap:9px; }
      .step { border-left:2px solid #2f426f; padding-left:9px; color: var(--muted); }
      pre { margin:0; white-space:pre-wrap; word-break:break-word; color:#9ec4ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (max-width: 920px) {
        .app { grid-template-columns: 1fr; }
        .left { border-right: 0; border-bottom: 1px solid var(--line); }
        .workspace { min-height: 65vh; }
        .kpis { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="left">
        <h1>Pixel Widget OS</h1>
        <p>Chat-free agent app. The widget is the product surface.</p>
        <div class="stack">
          <div class="card">
            <h2>Agent</h2>
            <div id="agents" class="stack"></div>
          </div>
          <div class="card">
            <h2>Memory scopes</h2>
            <div class="label">Global namespace</div>
            <input id="globalNs" value="global:user:matt" />
            <div class="label" style="margin-top:8px;">Session namespace</div>
            <input id="sessionNs" value="session:widget-demo" />
          </div>
          <div class="card">
            <h2>Widget mode</h2>
            <select id="mode">
              <option value="operator">Operator</option>
              <option value="builder">Builder</option>
              <option value="review">Review</option>
            </select>
          </div>
        </div>
      </aside>

      <section class="right">
        <div class="workspace">
          <div class="workspace-top">
            <div>
              <div class="badge">LIVE POC</div>
              <h1 id="title" style="font-size:20px;margin:8px 0 0;"></h1>
              <p id="subtitle"></p>
            </div>
            <button class="tab" id="regen">Regenerate state</button>
          </div>
          <div class="tabs" id="tabs"></div>
          <div class="content" id="content"></div>
        </div>
      </section>
    </main>

    <script>
      const AGENTS = [
        { id:'forge-builder', name:'Forge Builder', desc:'Ship product surfaces', widgets:['Execution Board','Impact KPIs','Release Queue'] },
        { id:'pixel-ops', name:'Pixel Ops', desc:'Operate incidents and deploy health', widgets:['Ops Board','Alerts','Runbook'] },
        { id:'tuner-growth', name:'Tuner Growth', desc:'Conversion and GTM microapps', widgets:['Experiment Grid','Funnel Health','Campaign Queue'] }
      ];
      const TABS = ['Overview','Workflow','Memory','Payload'];

      let state = { agentId: AGENTS[0].id, tab: 'Overview' };

      const agentsEl = document.getElementById('agents');
      const tabsEl = document.getElementById('tabs');
      const contentEl = document.getElementById('content');

      function activeAgent() { return AGENTS.find(a => a.id === state.agentId) || AGENTS[0]; }

      function payload() {
        return {
          runtimeVersion: 1,
          shellTargets: ['web','expo-native'],
          agent: activeAgent(),
          mode: document.getElementById('mode').value,
          memory: {
            global: document.getElementById('globalNs').value,
            agent: `agent:${activeAgent().id}`,
            session: document.getElementById('sessionNs').value
          },
          screen: 'full-widget',
          generatedAt: new Date().toISOString()
        };
      }

      function drawAgents() {
        agentsEl.innerHTML = '';
        AGENTS.forEach(a => {
          const b = document.createElement('button');
          b.className = 'agent-btn' + (a.id === state.agentId ? ' active' : '');
          b.innerHTML = `<strong>${a.name}</strong><br><span style="font-size:12px;color:#a9b9df">${a.desc}</span>`;
          b.onclick = () => { state.agentId = a.id; render(); };
          agentsEl.appendChild(b);
        });
      }

      function drawTabs() {
        tabsEl.innerHTML = '';
        TABS.forEach(t => {
          const b = document.createElement('button');
          b.className = 'tab' + (t === state.tab ? ' active' : '');
          b.textContent = t;
          b.onclick = () => { state.tab = t; drawContent(); drawTabs(); };
          tabsEl.appendChild(b);
        });
      }

      function drawContent() {
        const agent = activeAgent();
        const mode = document.getElementById('mode').value;
        document.getElementById('title').textContent = `${agent.name} • ${mode} mode`;
        document.getElementById('subtitle').textContent = 'No chat surface. This is a full-screen widget microapp.';

        if (state.tab === 'Overview') {
          contentEl.innerHTML = `
            <div class="kpis">
              <div class="kpi"><div style="color:#9ab4e6">Active widgets</div><div class="num">${agent.widgets.length}</div></div>
              <div class="kpi"><div style="color:#9ab4e6">Memory scopes</div><div class="num">3</div></div>
              <div class="kpi"><div style="color:#9ab4e6">Surface</div><div class="num">App+Web</div></div>
            </div>
            <div class="panel"><h2>Widget stack</h2><p>${agent.widgets.join(' • ')}</p></div>
          `;
          return;
        }

        if (state.tab === 'Workflow') {
          contentEl.innerHTML = `
            <div class="panel">
              <h2>Execution flow</h2>
              <div class="timeline">
                <div class="step">1) User picks specialized agent widget</div>
                <div class="step">2) Memory profile injected (global + agent + session)</div>
                <div class="step">3) Agent-specific UI executes tasks directly</div>
                <div class="step">4) Output shared to app/web shells with same payload</div>
              </div>
            </div>
          `;
          return;
        }

        if (state.tab === 'Memory') {
          const p = payload();
          contentEl.innerHTML = `
            <div class="panel">
              <h2>Active memory namespaces</h2>
              <ul>
                <li><strong>Global:</strong> ${p.memory.global}</li>
                <li><strong>Agent:</strong> ${p.memory.agent}</li>
                <li><strong>Session:</strong> ${p.memory.session}</li>
              </ul>
            </div>
          `;
          return;
        }

        contentEl.innerHTML = `<div class="panel"><h2>Unified payload</h2><pre>${JSON.stringify(payload(), null, 2)}</pre></div>`;
      }

      function render() { drawAgents(); drawTabs(); drawContent(); }

      document.getElementById('mode').addEventListener('change', drawContent);
      document.getElementById('globalNs').addEventListener('input', drawContent);
      document.getElementById('sessionNs').addEventListener('input', drawContent);
      document.getElementById('regen').addEventListener('click', drawContent);
      render();
    </script>
  </body>
</html>
