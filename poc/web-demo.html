<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Claw — Prompt to Widget App</title>
    <style>
      :root {
        --bg: #060b17;
        --panel: #111a35;
        --line: #2a3c67;
        --text: #eef4ff;
        --muted: #aebce0;
        --cyan: #5be5ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(900px 460px at 85% -25%, #2b1650 0%, transparent 60%), var(--bg);
      }
      .layout { min-height: 100vh; display: grid; grid-template-columns: 360px 1fr; }
      .left { border-right: 1px solid var(--line); background: rgba(10,16,36,.92); padding: 16px; overflow-y: auto; max-height: 100vh; }
      .right { padding: 16px; }
      h1 { margin: 0 0 6px; font-size: 26px; }
      h2 { margin: 0 0 8px; font-size: 13px; color: #9fc8ff; text-transform: uppercase; letter-spacing: .08em; }
      p { margin: 0; color: var(--muted); line-height: 1.45; }
      .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); margin-top: 12px; }
      textarea, input, button, select { font: inherit; }
      textarea, input, select {
        width: 100%; border: 1px solid #334673; border-radius: 10px; background: #0b1430; color: var(--text);
        padding: 10px;
      }
      textarea { min-height: 92px; resize: vertical; }
      .btn {
        border: 1px solid #3a5b88; border-radius: 10px; background: linear-gradient(90deg,#5be5ff,#93f1ff);
        color: #04111a; font-weight: 700; padding: 10px 12px; cursor: pointer;
      }
      .btn.ghost { background: #0c1633; color: var(--text); border-color: #334773; }
      .btn.danger { background: #2e1222; color: #ffd8ea; border-color: #80456a; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .status { margin-top: 10px; color: #9fd7ff; font-size: 13px; }
      .shell {
        border: 1px solid var(--line); border-radius: 16px; min-height: calc(100vh - 32px);
        background: rgba(12,20,42,.92); overflow: hidden;
      }
      .shell-top { border-bottom: 1px solid var(--line); padding: 14px; display:flex; justify-content:space-between; align-items:center; }
      .badge { border: 1px solid #2f5f8e; border-radius: 999px; padding: 4px 9px; font-size: 12px; color: #a8deff; }
      #appRoot { padding: 14px; }
      .meta { font-size: 12px; color: #95abd6; margin-top: 8px; }
      #loopHistory { margin-top: 10px; display: grid; gap: 8px; max-height: 220px; overflow-y: auto; }
      .loop-item { border: 1px solid #334773; border-radius: 10px; padding: 8px; background: #0b1430; }
      .loop-item strong { font-size: 12px; color: #b9ddff; }
      .loop-item p { margin-top: 4px; font-size: 12px; }
      .tag { display: inline-block; margin-left: 6px; border: 1px solid #3c5f8f; border-radius: 999px; padding: 1px 6px; font-size: 11px; color: #b3ddff; }
      @media (max-width: 940px) {
        .layout { grid-template-columns: 1fr; }
        .left { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <aside class="left">
        <h1>Goal → App</h1>
        <p>Describe the outcome you want. Pixel Claw iterates toward that goal with approval gates.</p>

        <div class="card">
          <h2>Goal prompt</h2>
          <textarea id="prompt">Goal: Improve onboarding conversion by making the first screen clearer and more trustworthy on mobile. Keep task flow the same.</textarea>
          <div class="row" style="margin-top:10px;">
            <button id="generate" class="btn">Generate app</button>
            <button id="seed" class="btn ghost">Seed sample tasks</button>
          </div>
          <div class="status" id="status">Ready.</div>
        </div>

        <div class="card">
          <h2>Design autopilot loop</h2>
          <div class="row" style="align-items:center;">
            <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:#c6dcff;">
              <input id="loopEnabled" type="checkbox" style="width:auto;padding:0;" />
              Loop mode ON
            </label>
            <input id="loopMax" type="number" min="1" max="20" value="8" title="Max iterations" />
          </div>
          <textarea id="loopGoal" style="margin-top:8px;min-height:70px;" placeholder="Design goal for loop iterations">Improve visual hierarchy, increase readability, and tighten spacing without changing core task flow.</textarea>
          <div class="row" style="margin-top:8px;">
            <button id="loopStart" class="btn ghost">Start loop</button>
            <button id="loopStop" class="btn danger">Stop</button>
          </div>
          <textarea id="loopFeedback" style="margin-top:8px;min-height:62px;" placeholder="If denying, provide feedback here."></textarea>
          <div class="row" style="margin-top:8px;">
            <button id="loopApprove" class="btn">Approve + next</button>
            <button id="loopDeny" class="btn ghost">Deny w/ feedback</button>
          </div>
          <div class="meta" id="loopMeta">Loop idle.</div>
          <div id="loopHistory"></div>
        </div>

        <div class="card">
          <h2>Session</h2>
          <input id="sessionNs" value="session:widget-demo:matt" />
          <p style="margin-top:8px;">State is saved to this namespace so the app feels persistent.</p>
        </div>

        <div class="card">
          <h2>MCP integration</h2>
          <div class="row">
            <select id="mcpProvider">
              <option value="linear">Linear</option>
              <option value="notion">Notion</option>
              <option value="github">GitHub</option>
            </select>
            <button id="mcpConnect" class="btn ghost">Connect</button>
          </div>
          <p id="mcpStatus" style="margin-top:8px;">Not connected</p>
        </div>
      </aside>

      <section class="right">
        <div class="shell">
          <div class="shell-top">
            <div>
              <div class="badge">LIVE WIDGET APP</div>
              <div style="margin-top:6px;font-weight:700;">Todo Flow Demo</div>
            </div>
            <button id="reset" class="btn ghost" style="padding:8px 10px;">Reset</button>
          </div>
          <div id="appRoot"></div>
        </div>
      </section>
    </main>

    <script type="module">
      import * as esbuild from 'https://unpkg.com/esbuild-wasm@0.25.3/esm/browser.min.js';

      const statusEl = document.getElementById('status');
      const promptEl = document.getElementById('prompt');
      const sessionEl = document.getElementById('sessionNs');
      const appRoot = document.getElementById('appRoot');
      const mcpProviderEl = document.getElementById('mcpProvider');
      const mcpStatusEl = document.getElementById('mcpStatus');

      const loopEnabledEl = document.getElementById('loopEnabled');
      const loopGoalEl = document.getElementById('loopGoal');
      const loopMaxEl = document.getElementById('loopMax');
      const loopStartEl = document.getElementById('loopStart');
      const loopStopEl = document.getElementById('loopStop');
      const loopApproveEl = document.getElementById('loopApprove');
      const loopDenyEl = document.getElementById('loopDeny');
      const loopFeedbackEl = document.getElementById('loopFeedback');
      const loopMetaEl = document.getElementById('loopMeta');
      const loopHistoryEl = document.getElementById('loopHistory');

      let runtimeReady = false;
      let appState = { todos: [] };
      let mcpConnected = false;
      let currentPrompt = '';
      let memoryDbPromise = null;

      const loopState = {
        running: false,
        iteration: 0,
        maxIterations: 8,
        awaitingDecision: false,
        lastDeniedFeedback: '',
        history: []
      };

      const defaultTodos = [
        { id: 1, title: 'Draft weekly priorities', status: 'planning' },
        { id: 2, title: 'Ship homepage improvement', status: 'active' },
        { id: 3, title: 'Review completed tasks', status: 'done' }
      ];

      function nsKey() { return `pixel-claw:${sessionEl.value.trim() || 'session:default'}`; }
      function stateKey() { return `${nsKey()}:appState`; }

      function openMemoryDb() {
        if (memoryDbPromise) return memoryDbPromise;
        memoryDbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open('pixel-claw-memory-v1', 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Failed to open IndexedDB'));
        });
        return memoryDbPromise;
      }

      async function memoryGet(key) {
        const db = await openMemoryDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('kv', 'readonly');
          const store = tx.objectStore('kv');
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error('IndexedDB get failed'));
        });
      }

      async function memoryPut(key, value) {
        const db = await openMemoryDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error('IndexedDB put failed'));
          tx.objectStore('kv').put(value, key);
        });
      }

      async function memoryDelete(key) {
        const db = await openMemoryDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error('IndexedDB delete failed'));
          tx.objectStore('kv').delete(key);
        });
      }

      async function saveState() {
        await memoryPut(stateKey(), appState);
      }

      async function loadState() {
        try {
          const saved = await memoryGet(stateKey());
          if (!saved || typeof saved !== 'object') return { todos: structuredClone(defaultTodos) };
          return saved;
        } catch {
          return { todos: structuredClone(defaultTodos) };
        }
      }

      function applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'pink') {
          root.style.setProperty('--bg', '#140812');
          root.style.setProperty('--panel', '#2a1031');
          root.style.setProperty('--line', '#6a2c79');
          root.style.setProperty('--text', '#ffeefe');
          root.style.setProperty('--muted', '#f0bce9');
          root.style.setProperty('--cyan', '#ff7bd5');
          return;
        }

        root.style.setProperty('--bg', '#060b17');
        root.style.setProperty('--panel', '#111a35');
        root.style.setProperty('--line', '#2a3c67');
        root.style.setProperty('--text', '#eef4ff');
        root.style.setProperty('--muted', '#aebce0');
        root.style.setProperty('--cyan', '#5be5ff');
      }

      async function generateWidgetFromLLM(prompt) {
        const res = await fetch('/api/generate-widget', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || 'Widget generation failed');
        if (!data?.sourceCode) throw new Error('Widget generation returned empty source');
        return data;
      }

      async function connectMcp() {
        mcpConnected = true;
        const provider = mcpProviderEl.value;
        mcpStatusEl.textContent = `Connected to ${provider} MCP`;
        statusEl.textContent = `MCP ready: ${provider}`;
      }

      async function mcpSuggestTask(prompt) {
        if (!mcpConnected) return null;
        const provider = mcpProviderEl.value;
        statusEl.textContent = `Asking ${provider} MCP + OpenAI for a task…`;

        try {
          const res = await fetch('/api/mcp-suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider, prompt })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data?.error || 'Request failed');
          statusEl.textContent = `MCP task suggestion ready (${provider})`;
          return data.suggestion;
        } catch (err) {
          console.error(err);
          statusEl.textContent = `MCP suggestion failed: ${err.message || err}`;
          return null;
        }
      }

      globalThis.__mcpSuggestTask = mcpSuggestTask;

      function renderLoopHistory() {
        loopMetaEl.textContent = loopState.running
          ? `Loop running • iteration ${loopState.iteration}/${loopState.maxIterations}${loopState.awaitingDecision ? ' • waiting for approve/deny' : ''}`
          : 'Loop idle.';

        loopHistoryEl.innerHTML = '';
        [...loopState.history].reverse().forEach((item) => {
          const node = document.createElement('div');
          node.className = 'loop-item';
          const tag = item.decision ? `<span class="tag">${item.decision}</span>` : '<span class="tag">pending</span>';
          node.innerHTML = `<strong>Iteration ${item.iteration}${tag}</strong><p>${item.summary || 'No summary returned.'}</p>${item.feedback ? `<p style="color:#e7bbcf;">Feedback: ${item.feedback}</p>` : ''}`;
          loopHistoryEl.appendChild(node);
        });

        loopApproveEl.disabled = !loopState.awaitingDecision;
        loopDenyEl.disabled = !loopState.awaitingDecision;
      }

      function appSource(prompt) {
        const safePrompt = JSON.stringify(prompt);
        return `
          globalThis.__pixelWidgetFactory = ({ state, setState, prompt, memory, api }) => {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'grid';
            wrapper.style.gap = '12px';

            const hero = document.createElement('div');
            hero.style.border = '1px solid #2a3c67';
            hero.style.borderRadius = '12px';
            hero.style.padding = '12px';
            hero.style.background = '#111a35';
            hero.innerHTML = \
              '<div style="font-size:12px;color:#9ec9ff;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Generated app</div>' +
              '<div style="font-size:22px;font-weight:700;color:#eef4ff;">Todo Widget</div>' +
              '<div style="margin-top:6px;color:#adbbe0;">' + prompt + '</div>';
            wrapper.appendChild(hero);

            const lanes = document.createElement('div');
            lanes.style.display = 'grid';
            lanes.style.gridTemplateColumns = 'repeat(auto-fit, minmax(220px, 1fr))';
            lanes.style.gap = '10px';

            const defs = [
              { key: 'planning', title: 'Planning', action: 'Start', next: 'active' },
              { key: 'active', title: 'Active', action: 'Complete', next: 'done' },
              { key: 'done', title: 'Done', action: '', next: '' }
            ];

            defs.forEach(def => {
              const lane = document.createElement('div');
              lane.style.border = '1px solid #2a3c67';
              lane.style.borderRadius = '12px';
              lane.style.padding = '10px';
              lane.style.background = '#0e1733';

              const title = document.createElement('div');
              const count = state.todos.filter(t => t.status === def.key).length;
              title.textContent = def.title + ' (' + count + ')';
              title.style.fontWeight = '700';
              title.style.marginBottom = '8px';
              lane.appendChild(title);

              const tasks = state.todos.filter(t => t.status === def.key);
              if (!tasks.length) {
                const empty = document.createElement('div');
                empty.style.color = '#8fa4d5';
                empty.style.fontSize = '13px';
                empty.textContent = 'No tasks here yet';
                lane.appendChild(empty);
              }

              tasks.forEach(task => {
                const row = document.createElement('div');
                row.style.border = '1px solid #334773';
                row.style.borderRadius = '10px';
                row.style.padding = '8px';
                row.style.marginBottom = '8px';
                row.style.background = '#0b1430';

                const text = document.createElement('div');
                text.textContent = task.title;
                text.style.marginBottom = '7px';
                row.appendChild(text);

                if (def.next) {
                  const btn = document.createElement('button');
                  btn.textContent = def.action;
                  btn.style.border = '1px solid #38618f';
                  btn.style.borderRadius = '9px';
                  btn.style.padding = '6px 8px';
                  btn.style.background = '#14284c';
                  btn.style.color = '#d9ecff';
                  btn.style.cursor = 'pointer';
                  btn.onclick = () => {
                    setState({
                      ...state,
                      todos: state.todos.map(t => t.id === task.id ? { ...t, status: def.next } : t)
                    });
                  };
                  row.appendChild(btn);
                }

                lane.appendChild(row);
              });

              lanes.appendChild(lane);
            });

            const addWrap = document.createElement('div');
            addWrap.style.border = '1px solid #2a3c67';
            addWrap.style.borderRadius = '12px';
            addWrap.style.padding = '12px';
            addWrap.style.background = '#111a35';
            addWrap.style.display = 'grid';
            addWrap.style.gap = '8px';

            const addTitle = document.createElement('div');
            addTitle.textContent = 'Add task';
            addTitle.style.fontWeight = '700';
            addWrap.appendChild(addTitle);

            const input = document.createElement('input');
            input.placeholder = 'What needs to get done?';
            input.style.width = '100%';
            input.style.border = '1px solid #334673';
            input.style.borderRadius = '9px';
            input.style.padding = '9px';
            input.style.background = '#0b1430';
            input.style.color = '#eef4ff';
            addWrap.appendChild(input);

            const add = document.createElement('button');
            add.textContent = 'Add to Planning';
            add.style.border = '1px solid #3a5b88';
            add.style.borderRadius = '9px';
            add.style.padding = '8px 10px';
            add.style.background = '#14284c';
            add.style.color = '#d9ecff';
            add.style.cursor = 'pointer';
            add.onclick = () => {
              const title = input.value.trim();
              if (!title) return;
              setState({ ...state, todos: [{ id: Date.now(), title, status: 'planning' }, ...state.todos] });
            };
            addWrap.appendChild(add);

            const mcp = document.createElement('button');
            mcp.textContent = 'Suggest with MCP';
            mcp.style.border = '1px solid #3a5b88';
            mcp.style.borderRadius = '9px';
            mcp.style.padding = '8px 10px';
            mcp.style.background = '#0f1f3f';
            mcp.style.color = '#d9ecff';
            mcp.style.cursor = 'pointer';
            mcp.onclick = async () => {
              const suggestion = await globalThis.__mcpSuggestTask(prompt);
              if (!suggestion) return;
              setState({ ...state, todos: [{ id: Date.now(), title: suggestion, status: 'planning' }, ...state.todos] });
            };
            addWrap.appendChild(mcp);

            wrapper.appendChild(lanes);
            wrapper.appendChild(addWrap);
            return wrapper;
          };

          globalThis.__pixelWidgetFactoryPrompt = ${safePrompt};
        `;
      }

      async function ensureRuntime() {
        if (runtimeReady) return;
        statusEl.textContent = 'Initializing in-browser compiler…';
        await esbuild.initialize({ wasmURL: 'https://unpkg.com/esbuild-wasm@0.25.3/esbuild.wasm' });
        runtimeReady = true;
      }

      async function generateAndCompile(prompt) {
        await ensureRuntime();
        let lastErr = null;

        for (let attempt = 1; attempt <= 2; attempt += 1) {
          statusEl.textContent = attempt === 1
            ? 'Generating widget JSON via LLM…'
            : 'Retrying LLM generation with stricter render contract…';

          const generationPrompt = attempt === 1
            ? prompt
            : `${prompt}\n\nIMPORTANT: __pixelWidgetFactory must return a real HTMLElement (e.g. document.createElement('div')).`;

          try {
            const payload = await generateWidgetFromLLM(generationPrompt);
            applyTheme(payload.theme || 'default');

            statusEl.textContent = `Compiling generated app… (attempt ${attempt}/2)`;
            const result = await esbuild.transform(payload.sourceCode, { loader: 'ts', target: 'es2020', format: 'iife' });
            // eslint-disable-next-line no-new-func
            new Function(result.code)();
            if (!globalThis.__pixelWidgetFactory) throw new Error('Generated code did not set __pixelWidgetFactory');

            renderFromFactory(prompt);
            statusEl.textContent = 'Done. LLM JSON generated code and compiled in browser.';
            return payload;
          } catch (err) {
            lastErr = err;
            console.warn(`LLM attempt ${attempt} failed`, err);
          }
        }

        throw lastErr || new Error('Unknown LLM generation failure');
      }

      async function compileAndRender(promptOverride = null) {
        try {
          const prompt = (promptOverride || promptEl.value.trim() || 'Todo app widget').trim();
          currentPrompt = prompt;
          return await generateAndCompile(prompt);
        } catch (err) {
          console.error(err);
          statusEl.textContent = `LLM compile failed (no fallback): ${err.message || err}`;
          return null;
        }
      }

      function buildLoopPrompt() {
        const basePrompt = promptEl.value.trim() || 'Todo app widget';
        const goal = loopGoalEl.value.trim() || 'Improve the design quality while preserving behavior.';
        const last = loopState.history[loopState.history.length - 1];
        const deniedFeedback = loopState.lastDeniedFeedback?.trim();

        const parts = [
          basePrompt,
          `\n\nLOOP MODE CONTEXT:`,
          `Design goal: ${goal}`,
          `Iteration: ${loopState.iteration + 1} of ${loopState.maxIterations}`,
          'Keep core todo behavior intact unless feedback asks otherwise.'
        ];

        if (last?.summary) {
          parts.push(`Previous iteration summary: ${last.summary}`);
        }

        if (deniedFeedback) {
          parts.push(`Reviewer denied prior version. Required feedback to address: ${deniedFeedback}`);
        }

        parts.push('Return production-safe DOM code and include a concise summary of what changed.');
        return parts.join('\n');
      }

      async function runLoopIteration() {
        if (!loopState.running) return;
        if (loopState.iteration >= loopState.maxIterations) {
          loopState.running = false;
          loopState.awaitingDecision = false;
          renderLoopHistory();
          statusEl.textContent = 'Loop reached max iterations.';
          return;
        }

        const loopPrompt = buildLoopPrompt();
        const payload = await compileAndRender(loopPrompt);
        if (!payload) {
          loopState.running = false;
          loopState.awaitingDecision = false;
          renderLoopHistory();
          return;
        }

        loopState.iteration += 1;
        loopState.awaitingDecision = true;
        loopState.history.push({
          iteration: loopState.iteration,
          summary: payload.summary || 'Design revision generated.',
          decision: '',
          feedback: ''
        });
        loopState.lastDeniedFeedback = '';
        renderLoopHistory();
      }

      async function startLoop() {
        if (!loopEnabledEl.checked) {
          statusEl.textContent = 'Enable Loop mode first.';
          return;
        }

        loopState.running = true;
        loopState.iteration = 0;
        loopState.maxIterations = Math.max(1, Math.min(20, Number(loopMaxEl.value || 8)));
        loopState.awaitingDecision = false;
        loopState.lastDeniedFeedback = '';
        loopState.history = [];
        renderLoopHistory();
        await runLoopIteration();
      }

      function stopLoop() {
        loopState.running = false;
        loopState.awaitingDecision = false;
        renderLoopHistory();
        statusEl.textContent = 'Loop stopped.';
      }

      async function approveLoopIteration() {
        if (!loopState.awaitingDecision) return;
        const last = loopState.history[loopState.history.length - 1];
        if (last) last.decision = 'approved';
        loopState.awaitingDecision = false;
        renderLoopHistory();
        await runLoopIteration();
      }

      async function denyLoopIteration() {
        if (!loopState.awaitingDecision) return;
        const feedback = loopFeedbackEl.value.trim();
        if (!feedback) {
          statusEl.textContent = 'Add deny feedback so the next iteration has guidance.';
          return;
        }
        const last = loopState.history[loopState.history.length - 1];
        if (last) {
          last.decision = 'denied';
          last.feedback = feedback;
        }
        loopState.awaitingDecision = false;
        loopState.lastDeniedFeedback = feedback;
        renderLoopHistory();
        await runLoopIteration();
      }

      function renderFromFactory(prompt) {
        const factory = globalThis.__pixelWidgetFactory;
        if (!factory) throw new Error('Missing __pixelWidgetFactory at render time');

        const setState = (next) => {
          appState = next;
          void saveState();
          renderFromFactory(prompt);
        };

        const memory = {
          get: (key) => memoryGet(`${nsKey()}:memory:${key}`),
          put: (key, value) => memoryPut(`${nsKey()}:memory:${key}`, value),
          del: (key) => memoryDelete(`${nsKey()}:memory:${key}`)
        };

        const api = {
          suggestTask: (nextPrompt) => globalThis.__mcpSuggestTask(nextPrompt || prompt)
        };

        appRoot.innerHTML = '';
        const node = factory({ state: appState, setState, prompt, memory, api });
        if (!(node instanceof Node)) throw new Error('Generated factory did not return a DOM Node');
        appRoot.appendChild(node);

        globalThis.__pixelDemo = {
          getState: () => appState,
          setState: async (next) => {
            appState = next;
            await saveState();
            renderFromFactory(currentPrompt || prompt);
          },
          memory
        };
      }

      async function seedTasks() {
        appState = { todos: structuredClone(defaultTodos) };
        await saveState();
        await compileAndRender();
      }

      document.getElementById('generate').addEventListener('click', async () => {
        stopLoop();
        await compileAndRender();
      });
      document.getElementById('seed').addEventListener('click', () => { void seedTasks(); });
      document.getElementById('mcpConnect').addEventListener('click', connectMcp);
      document.getElementById('reset').addEventListener('click', async () => {
        await memoryDelete(stateKey());
        appState = { todos: structuredClone(defaultTodos) };
        stopLoop();
        await compileAndRender();
      });
      sessionEl.addEventListener('change', async () => {
        appState = await loadState();
        stopLoop();
        await compileAndRender();
      });

      loopStartEl.addEventListener('click', () => { void startLoop(); });
      loopStopEl.addEventListener('click', stopLoop);
      loopApproveEl.addEventListener('click', () => { void approveLoopIteration(); });
      loopDenyEl.addEventListener('click', () => { void denyLoopIteration(); });

      appState = await loadState();
      renderLoopHistory();
      await compileAndRender();
    </script>
  </body>
</html>
